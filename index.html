<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno & Marrone em Porto - Contagem Regressiva</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay"></div>
    
    <main class="content">
        <header>
            <h1>Bruno & Marrone em Porto</h1>
            <p class="location">📅 08 de Março | 🕗 20:00 (Dublin Time)</p>
        </header>

        <section class="countdown-container">
            <div class="time-box">
                <span id="days">00</span>
                <p>Dias</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Horas</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Minutos</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Segundos</p>
            </div>
        </section>

        <section class="player">
            <h3>📻 Som do Boteco</h3>
            <div class="music-info">
                <p id="song-title">Selecione o Play</p>
            </div>
            <div class="controls">
                <button onclick="prevTrack()">⏮</button>
                <button id="play-btn" onclick="togglePlay()">▶️</button>
                <button onclick="nextTrack()">⏭</button>
            </div>
            <audio id="audio-element"></audio>
        </section>

        <footer class="drinks-icon">
            🍺 🥃 🍺
            <p>Preparem os fígados!</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
